[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time macro pulled in by Tauri's Linux GTK3 stack" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; tauri-plugin-opener still uses zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; tauri-plugin-opener still uses zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; tauri-plugin-opener still uses zbus 5" },
    { id = "RUSTSEC-2026-0367", reason = "zip in tauri-plugin-updater only unpacks signed Windows updates, and ours are not zipped" },
    { id = "RUSTSEC-2026-0368", reason = "zip in tauri-plugin-updater only unpacks signed Windows updates, and ours are not zipped" },
    { id = "RUSTSEC-2026-0369", reason = "zip in tauri-plugin-updater only unpacks signed Windows updates, and ours are not zipped" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
