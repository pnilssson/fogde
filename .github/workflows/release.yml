name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
      version: ${{ steps.draft.outputs.version }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          version="0.1.$RUN"
          id=$(gh api "repos/$REPO/releases" -f tag_name="v$version" -f target_commitish="$SHA" -f name="Fogde $version" -F draft=true --jq .id)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  hosts:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: perl -pi -e 's/^version = ".*"$/version = "$ENV{VERSION}"/' Cargo.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just,cargo-zigbuild
      - run: just server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosts
          path: |
            target/x86_64-unknown-linux-musl/release/fogde-host
            target/aarch64-unknown-linux-musl/release/fogde-host
          if-no-files-found: error

  build:
    needs: [draft, hosts]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: perl -pi -e 's/^version = ".*"$/version = "$ENV{VERSION}"/' Cargo.toml
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libasound2-dev
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosts
          path: target
      - run: cargo install cargo-packager --git https://github.com/crabnebula-dev/cargo-packager --rev d3a520ef0e3ddc4325cefa982ed5fd7322484354 --locked
      - if: runner.os != 'macOS'
        run: cargo build -p fogde --release
      - if: runner.os == 'macOS'
        run: |
          cargo build -p fogde --release --target aarch64-apple-darwin
          cargo build -p fogde --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/fogde target/aarch64-apple-darwin/release/fogde target/x86_64-apple-darwin/release/fogde
      - env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
        run: cargo packager -p fogde --release $TARGET --out-dir target/packages
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          shopt -s nullglob
          files=(target/packages/*-setup.exe target/packages/*-setup.exe.sig target/packages/*.dmg target/packages/*.app.tar.gz target/packages/*.app.tar.gz.sig target/packages/*.AppImage target/packages/*.AppImage.sig target/packages/*.deb target/packages/*.deb.sig)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no packages were built" >&2
            exit 1
          fi
          gh release upload "v$VERSION" "${files[@]}" --repo "$REPO"

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.draft.outputs.id }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          shopt -s inherit_errexit
          assets=$(gh api "repos/$REPO/releases/$ID/assets?per_page=100")
          entry() {
            local name id signature
            name=$(jq -er --arg suffix "$1" 'map(select(.name | endswith($suffix))) | .[0].name' <<<"$assets")
            id=$(jq -er --arg sig "$name.sig" 'map(select(.name == $sig)) | .[0].id' <<<"$assets")
            signature=$(gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id")
            jq -n --arg url "https://github.com/$REPO/releases/download/v$VERSION/$name" --arg signature "$signature" --arg format "$2" '{url: $url, signature: $signature, format: $format}'
          }
          windows=$(entry -setup.exe nsis)
          mac=$(entry .app.tar.gz app)
          linux=$(entry .AppImage appimage)
          deb=$(entry .deb appimage)
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$windows" --argjson mac "$mac" --argjson linux "$linux" --argjson deb "$deb" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": $windows, "darwin-aarch64": $mac, "darwin-x86_64": $mac, "macos-aarch64": $mac, "macos-x86_64": $mac, "linux-x86_64": $linux, "linux-x86_64-deb": $deb}}' > latest.json
          gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=latest.json" \
            -H "Content-Type: application/json" --input latest.json > /dev/null
          gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false -f make_latest=true > /dev/null

  discard:
    needs: [draft, build, publish]
    if: failure() && needs.draft.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.draft.outputs.id }}
        run: gh api -X DELETE "repos/$REPO/releases/$ID"
