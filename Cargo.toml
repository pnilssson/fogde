[workspace]
members = ["apps/desktop/src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
agents = { path = "crates/agents" }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
ctrlc = "3.5.2"
download = { path = "crates/download" }
file-id = { version = "0.2.3", features = ["serde"] }
filetime = "0.2.29"
futures-util = "0.3.34"
getrandom = "0.4.3"
git = { path = "crates/git" }
github = { path = "crates/github" }
herdr-client = { path = "crates/herdr-client" }
host = { path = "crates/host" }
interprocess = { version = "2.4.6", features = ["tokio"] }
notify-debouncer-mini = "0.7.0"
process = { path = "crates/process" }
protocol = { path = "crates/protocol" }
remote = { path = "crates/remote" }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-window-state = "2.5.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
tokio = "1.53.3"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
windows-version = "0.100.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
