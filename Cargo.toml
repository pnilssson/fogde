[workspace]
members = ["apps/desktop/src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
github = { path = "crates/github" }
host = { path = "crates/host" }
interprocess = { version = "2.4.6", features = ["tokio"] }
process = { path = "crates/process" }
protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"
windows-version = "0.1.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
