[workspace]
members = ["apps/desktop", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
agents = { path = "crates/agents" }
alacritty_terminal = { version = "0.26.0", default-features = false }
anyhow = "1.0.104"
axum = "0.8.9"
cargo-packager-updater = "0.2.3"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
client = { path = "crates/client" }
download = { path = "crates/download" }
file-id = { version = "0.2.3", features = ["serde"] }
filetime = "0.2.29"
futures-util = "0.3.34"
getrandom = "0.4.3"
git = { path = "crates/git" }
github = { path = "crates/github" }
gpui-kit = "=0.8.1"
herdr-client = { path = "crates/herdr-client" }
host = { path = "crates/host" }
icns = "0.5.0"
ico = "0.6.0"
if-addrs = "0.15.0"
interprocess = { version = "2.4.6", features = ["tokio"] }
markdown = "1.0.0"
notify-debouncer-mini = "0.7.0"
notify-rust = "4.18.2"
process = { path = "crates/process" }
protocol = { path = "crates/protocol" }
remote = { path = "crates/remote" }
resvg = "0.49.0"
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tempfile = "3.27.0"
terminal = { path = "crates/terminal" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
tokio = "1.53.3"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
windows-version = "0.100.0"
winresource = "0.1.34"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
