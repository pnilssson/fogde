query($owner: String!, $name: String!, $mine: String!, $assigned: String!) {
  repository(owner: $owner, name: $name) {
    issues(first: 50, states: [OPEN], orderBy: { field: UPDATED_AT, direction: DESC }) {
      nodes { ...listedIssue }
    }
  }
  mine: search(query: $mine, type: ISSUE, first: 50) { nodes { ...listedIssue } }
  assigned: search(query: $assigned, type: ISSUE, first: 50) { nodes { ...listedIssue } }
}
