[package]
name = "process"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
process-wrap = { workspace = true, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
tokio = { workspace = true, features = ["io-util", "macros", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true
